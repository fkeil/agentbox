# Syncthing on TrueNAS SCALE 24.10+ (192.168.1.4).
#
# Traefik is NOT here. It already runs on the Proxmox host, so it cannot read
# this box's Docker socket and cannot discover this container by label. The
# router lives in ../homelab/traefik-routes/20-syncthing.yaml instead, and 8384
# is published below so a Traefik on another host can actually reach it.
#
# Because 8384 is now on the LAN, direct access bypasses Traefik and its
# allowlist. Set a Syncthing GUI password -- that is the only thing guarding it.

services:
  syncthing:
    image: syncthing/syncthing:1.29
    container_name: syncthing
    restart: unless-stopped
    hostname: ${SYNCTHING_DEVICE_NAME}
    ports:
      # Web UI. Fronted by Traefik on Proxmox; see the warning above.
      - "8384:8384"
      # Sync protocol and discovery are raw TCP/UDP, not HTTP, so they never
      # pass through a reverse proxy.
      - "22000:22000/tcp"
      - "22000:22000/udp"
      - "21027:21027/udp"
    environment:
      PUID: "${PUID}"
      PGID: "${PGID}"
      STGUIADDRESS: "0.0.0.0:8384"
      STNODEFAULTFOLDER: "1"
    volumes:
      - "${APPS_PATH}/syncthing/config:/var/syncthing/config"
      - "${SYNC_DATA_PATH}:/var/syncthing/data"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8384/rest/noauth/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
