; CouchDB tuning for Obsidian LiveSync.
;
; The [cors] origins line is the one that matters most: `capacitor://localhost`
; is mobile Obsidian and `app://obsidian.md` is desktop. Omitting the mobile
; origin produces the classic failure where desktop syncs fine and the phone
; silently does nothing.

[couchdb]
single_node = true
; Obsidian attachments (images, PDFs) ride inside documents.
max_document_size = 50000000

[chttpd]
require_valid_user = true
; Initial vault upload sends large bulk batches.
max_http_request_size = 4294967296
enable_cors = true
bind_address = 0.0.0.0

[chttpd_auth]
require_valid_user = true
authentication_redirect = /_utils/session.html

[httpd]
enable_cors = true
WWW-Authenticate = Basic realm="couchdb"

[cors]
origins = app://obsidian.md,capacitor://localhost,http://localhost
credentials = true
headers = accept, authorization, content-type, origin, referer
methods = GET, PUT, POST, HEAD, DELETE
max_age = 3600
